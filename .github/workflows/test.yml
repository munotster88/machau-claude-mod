name: test
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The mod's own tests, on this computer's real shell
        run: node --test machau-mod/hooks/lib.test.ts machau-mod/hooks/host.test.ts
      - name: Claude's own check of the plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          claude plugin validate ./machau-mod
      - name: Install from the marketplace, as a person would
        run: |
          claude plugin marketplace add ./
          claude plugin install machau-mod@machau
          claude plugin list
      - name: Does the mod start in a session (no sign-in here, so the reply itself fails)
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          claude -p "say ok" --plugin-dir ./machau-mod || true
          echo "--- the mod's own log:"
          cat "$HOME/.local/state/machau-mod/events.jsonl" || echo "no log written"
